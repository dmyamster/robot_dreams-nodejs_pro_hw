services:
  postgres:
    image: postgres:16-alpine
    container_name: broker_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: super_secret_db_pass_123
      POSTGRES_DB: broker_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d broker_db"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 3s

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: broker_pgbouncer
    restart: always
    ports:
      - "6432:6432"
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 3s

  pact-broker:
    image: pactfoundation/pact-broker:latest
    container_name: broker_pact_broker
    restart: always
    ports:
      - "9292:9292"
    environment:
      PACT_BROKER_DATABASE_URL: "postgres://postgres:super_secret_db_pass_123@postgres:5432/pact_broker"
      PACT_BROKER_LOG_LEVEL: "INFO"
      PACT_BROKER_ALLOW_OVERWRITE_OF_CONTRACT: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9292/diagnostic/status/heartbeat || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 15s

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: broker_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s

  redis-cache:
    image: redis:7-alpine
    container_name: broker_redis_cache
    restart: always
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 3s

  redis-queue:
    image: redis:7-alpine
    container_name: broker_redis_queue
    restart: always
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6380:6379"
    volumes:
      - redis_queue_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 3s

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: broker_minio
    restart: always
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: hw26user
      MINIO_ROOT_PASSWORD: hw26secretpass
    ports:
      - "22650:9000"
      - "22651:9001"
    tmpfs:
      - /data:size=1g
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
  rabbitmq_data:
  redis_queue_data:
