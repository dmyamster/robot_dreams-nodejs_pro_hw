name: PR CI Gates & Rollout

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: Quality Gates (Types, Lint, Contract, Arch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Gate 1 — TypeScript & ESLint
        run: |
          npx tsc --noEmit
          npx eslint src

      - name: Gate 2 — OpenAPI Contract (oasdiff)
        run: |
          curl -fsSL https://raw.githubusercontent.com/oasdiff/oasdiff/main/install.sh | sh
          npm run bundle:spec
          BASE_REF="${{ github.base_ref || 'main' }}"
          if git show "origin/${BASE_REF}:openapi/openapi.yaml" > /tmp/base-openapi.yaml 2>/dev/null; then
            npx redocly bundle /tmp/base-openapi.yaml -o /tmp/base-spec.json
            oasdiff breaking /tmp/base-spec.json spec.json --fail-on ERR
          else
            oasdiff breaking spec.json spec.json --fail-on ERR
          fi

      - name: Gate 3 — Architecture Boundaries (dependency-cruiser)
        run: npx depcruise --config .dependency-cruiser.cjs src

  build:
    name: Build Once & Scan Image
    needs: [gates]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image-ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image reference
        id: meta
        run: |
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          REPO_LOWER="$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image_ref=ghcr.io/${REPO_LOWER}/broker-api:${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "repo_lower=${REPO_LOWER}" >> "$GITHUB_OUTPUT"

      - name: Build and push image (single build)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.image_ref }}

      - name: Record build invocation
        run: |
          echo "built ${{ steps.meta.outputs.image_ref }} ${{ steps.build.outputs.digest }}" > build.log

      - name: Install Trivy and run Gate 4 (Image Scan)
        id: scan
        env:
          APP_IMAGE: ${{ steps.meta.outputs.image_ref }}
          SCAN_MAX: '100'
        run: |
          sudo apt-get update && sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy
          set +e
          npm run scan
          SCAN_EXIT=$?
          set -e
          echo "$SCAN_EXIT" > scan-exit.txt
          exit "$SCAN_EXIT"

      - name: Upload build metadata
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-meta
          path: |
            build.log
            scan-exit.txt

  cost-gate:
    name: Pulumi Preview & Cost Gate
    needs: [gates]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix infra

      - name: Set up Pulumi CLI
        uses: pulumi/actions@0ce33695f880624d4f27bd6db25e680c7df4d551 # v7.2.0
        with:
          pulumi-version: '^3.150.0'

      - name: Generate Pulumi preview plan
        env:
          PULUMI_BACKEND_URL: file://${{ github.workspace }}/.pulumi
          PULUMI_CONFIG_PASSPHRASE: ci-preview-passphrase
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          mkdir -p .pulumi secrets
          if [ -z "${VAULT_TOKEN:-}" ]; then
            node -e '
              const { generateKeyPairSync, randomBytes } = require("node:crypto");
              const fs = require("node:fs");
              const k = generateKeyPairSync("ec", {
                namedCurve: "P-256",
                privateKeyEncoding: { type: "pkcs8", format: "pem" },
                publicKeyEncoding: { type: "spki", format: "pem" },
              });
              fs.writeFileSync("secrets/db_password", randomBytes(16).toString("hex"));
              fs.writeFileSync("secrets/jwt_private.b64", Buffer.from(k.privateKey).toString("base64"));
              fs.writeFileSync("secrets/jwt_public.b64", Buffer.from(k.publicKey).toString("base64"));
              fs.writeFileSync("secrets/refresh_pepper", randomBytes(32).toString("hex"));
              fs.writeFileSync("secrets/storage_access_key", "ci-storage-key");
              fs.writeFileSync("secrets/storage_secret_key", randomBytes(16).toString("hex"));
            '
          fi
          bash scripts/with-secrets.sh dev bash -c 'pulumi --cwd infra stack select dev --create && pulumi --cwd infra preview --json --non-interactive > plan.json'

      - name: Run Cost Gate
        env:
          PLAN_JSON: plan.json
          COST_BUDGET_USD: '10'
          COST_BYPASS: ${{ contains(github.event.pull_request.labels.*.name, 'cost-approved') }}
        run: npm run gate:cost

      - name: Upload plan.json
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan-artifact
          path: plan.json

  oidc-rollout:
    name: OIDC Gate, Kind Deploy & Zero-Downtime Rollout
    needs: [build, cost-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix infra

      - name: Download build metadata and plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Verify GitHub OIDC token via oidc-gate
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=broker-ci-deploy" | jq -r '.value')
          OIDC_TOKEN="$TOKEN" node scripts/oidc-gate.mjs \
            --policy oidc/policy.json \
            --iss https://token.actions.githubusercontent.com \
            --aud broker-ci-deploy | tee oidc-result.txt

      - name: Create Kind cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: broker-hw28
          config: k8s/kind-config.yaml

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull built image by digest and load into Kind
        env:
          IMAGE_REF: ${{ needs.build.outputs.image-ref }}
          BUILT_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          IMAGE_REPO="${IMAGE_REF%:*}"
          IMAGE_BY_DIGEST="${IMAGE_REPO}@${BUILT_DIGEST}"
          docker pull "$IMAGE_BY_DIGEST"
          kind load docker-image "$IMAGE_BY_DIGEST" --name broker-hw28

      - name: Set up Pulumi CLI
        uses: pulumi/actions@0ce33695f880624d4f27bd6db25e680c7df4d551 # v7.2.0
        with:
          pulumi-version: '^3.150.0'

      - name: Deploy with Pulumi and run demo:rollout
        id: deploy
        env:
          PULUMI_BACKEND_URL: file://${{ github.workspace }}/.pulumi
          PULUMI_CONFIG_PASSPHRASE: ci-deploy-passphrase
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          IMAGE_REF: ${{ needs.build.outputs.image-ref }}
          BUILT_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          mkdir -p .pulumi secrets
          if [ -z "${VAULT_TOKEN:-}" ]; then
            node -e '
              const { generateKeyPairSync, randomBytes } = require("node:crypto");
              const fs = require("node:fs");
              const k = generateKeyPairSync("ec", {
                namedCurve: "P-256",
                privateKeyEncoding: { type: "pkcs8", format: "pem" },
                publicKeyEncoding: { type: "spki", format: "pem" },
              });
              fs.writeFileSync("secrets/db_password", randomBytes(16).toString("hex"));
              fs.writeFileSync("secrets/jwt_private.b64", Buffer.from(k.privateKey).toString("base64"));
              fs.writeFileSync("secrets/jwt_public.b64", Buffer.from(k.publicKey).toString("base64"));
              fs.writeFileSync("secrets/refresh_pepper", randomBytes(32).toString("hex"));
              fs.writeFileSync("secrets/storage_access_key", "ci-storage-key");
              fs.writeFileSync("secrets/storage_secret_key", randomBytes(16).toString("hex"));
            '
          fi
          IMAGE_REPO="${IMAGE_REF%:*}"
          export APP_IMAGE="${IMAGE_REPO}@${BUILT_DIGEST}"
          export REV="${BUILT_DIGEST}"
          bash scripts/with-secrets.sh dev bash -c 'pulumi --cwd infra stack select dev --create && pulumi --cwd infra up --yes --non-interactive'
          MIN_REQUESTS=2000 bash demo/demo-rollout.sh | tee rollout.txt

      - name: Collect pipeline evidence
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          IMAGE_REF: ${{ needs.build.outputs.image-ref }}
          BUILT_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          mkdir -p evidence-out
          cp artifacts/build-meta/build.log evidence-out/build.log || true
          cp artifacts/plan-artifact/plan.json evidence-out/plan.json || true
          cp rollout.txt evidence-out/rollout.txt || touch evidence-out/rollout.txt

          kubectl -n broker-hw28 get deploy broker-api -o json > evidence-out/deployment.json || echo '{}' > evidence-out/deployment.json

          DEPLOYED_IMAGE=$(jq -r '.spec.template.spec.containers[0].image // ""' evidence-out/deployment.json)
          DEPLOYED_DIGEST="${DEPLOYED_IMAGE##*@}"
          BUILD_INVOCATIONS=$(wc -l < evidence-out/build.log 2>/dev/null | tr -d ' ' || echo 0)

          OIDC_ISS=$(awk -F= '/^oidc-iss=/{print $2}' oidc-result.txt 2>/dev/null || true)
          OIDC_AUD=$(awk -F= '/^oidc-aud=/{print $2}' oidc-result.txt 2>/dev/null || true)
          OIDC_SUB=$(awk -F= '/^oidc-sub=/{print $2}' oidc-result.txt 2>/dev/null || true)
          OIDC_SIG=$(awk -F= '/^sig-verified=/{print $2}' oidc-result.txt 2>/dev/null || echo 0)

          REQ=$(awk -F= '/^requests=/{print $2}' evidence-out/rollout.txt 2>/dev/null || echo 0)
          OK=$(awk -F= '/^ok=/{print $2}' evidence-out/rollout.txt 2>/dev/null || echo 0)
          FAIL=$(awk -F= '/^failed=/{print $2}' evidence-out/rollout.txt 2>/dev/null || echo 1)
          SEC=$(awk -F= '/^rollout-seconds=/{print $2}' evidence-out/rollout.txt 2>/dev/null || echo 0)

          SECRET_HITS=0
          for sf in secrets/db_password secrets/refresh_pepper secrets/storage_secret_key; do
            if [ -f "$sf" ]; then
              val=$(tr -d '\r\n' < "$sf")
              if [ -n "$val" ] && grep -qF "$val" evidence-out/deployment.json; then
                SECRET_HITS=$((SECRET_HITS + 1))
              fi
            fi
          done

          SCAN_EXIT=$(cat artifacts/build-meta/scan-exit.txt 2>/dev/null | tr -d ' \n' || echo 0)

          {
            echo "run-id=${RUN_ID}"
            echo "head-sha=${HEAD_SHA}"
            echo "image-ref=${IMAGE_REF}"
            echo "built-digest=${BUILT_DIGEST}"
            echo "deployed-digest=${DEPLOYED_DIGEST}"
            echo "build-invocations=${BUILD_INVOCATIONS}"
            echo "creds-source=oidc"
            echo "oidc-iss=${OIDC_ISS}"
            echo "oidc-aud=${OIDC_AUD}"
            echo "oidc-sub=${OIDC_SUB}"
            echo "oidc-sig-verified=${OIDC_SIG}"
            echo "rollout-requests=${REQ}"
            echo "rollout-ok=${OK}"
            echo "rollout-failed=${FAIL}"
            echo "rollout-seconds=${SEC}"
            echo "secret-in-manifest=${SECRET_HITS}"
            echo "gate-scan-exit=${SCAN_EXIT}"
          } > evidence-out/evidence.txt

      - name: Upload pipeline-evidence artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pipeline-evidence
          path: evidence-out/
